openapi: 3.0.3
info:
  title: PetBridge API
  version: 0.5.0
  description: >
    B3: health probes, authentication (dev login, Apple/Google stubs, refresh, logout),
    onboarding, joining a room by invite code, listing my codes and my rooms, and room management
    (owner removes a member, dissolves the room or issues a code; members leave), and (B5a) the phrase book and sending and listing room messages.
    Every business path lives under /api/v1; probes do not.
    Success bodies are {"data": ...}; failures are {"error": {code, message, request_id, details?}}.
    Login routes are limited to 10 requests per minute per client IP (429 RATE_LIMITED with Retry-After).
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe (does not check dependencies)
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [ok] }
  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe
      description: >
        PostgreSQL down returns 503. Redis down still returns 200 with status "degraded",
        because Redis failure must not stop message delivery.
      responses:
        '200':
          description: Ready, or degraded (Redis down)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [ok, degraded] }
                      redis: { type: string, enum: [down] }
        '503':
          description: PostgreSQL unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/login/dev:
    post:
      operationId: loginDev
      tags: [auth]
      summary: Development login by email
      description: >
        Local development only. The route exists only when APP_ENV=local and DEV_LOGIN_ENABLED=true;
        otherwise it returns 404. An unknown email creates a new (not yet onboarded) user.
        The email is trimmed and lower-cased. Seed emails: dev-a@local .. dev-f@local.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, maxLength: 254, example: dev-a@local }
      responses:
        '200': { $ref: '#/components/responses/LoginOK' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/AccountDisabled' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/auth/login/apple:
    post:
      operationId: loginApple
      tags: [auth]
      summary: Sign in with Apple
      description: Not available yet; returns 501 PROVIDER_NOT_CONFIGURED until real verification is wired up.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IDTokenRequest' }
      responses:
        '200': { $ref: '#/components/responses/LoginOK' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountDisabled' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '501': { $ref: '#/components/responses/ProviderNotConfigured' }
  /api/v1/auth/login/google:
    post:
      operationId: loginGoogle
      tags: [auth]
      summary: Sign in with Google
      description: >
        Verifies a Google ID token against Google's signing keys. Returns 501 PROVIDER_NOT_CONFIGURED
        when GOOGLE_CLIENT_ID is not set, and 503 NOT_READY when Google's keys cannot be fetched
        (retry later; this is not a rejected login).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IDTokenRequest' }
      responses:
        '200': { $ref: '#/components/responses/LoginOK' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountDisabled' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '501': { $ref: '#/components/responses/ProviderNotConfigured' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Rotate the refresh token
      description: >
        Returns a new access token and a new refresh token; the old refresh token stops working.
        Presenting an already-used refresh token revokes the whole token family (REFRESH_REUSED),
        except within 60 seconds of its rotation while the family still holds a live token: that is
        treated as a client retrying a rotation whose response it lost, and returns a new pair (every
        other token of the family stops working). Clients should refresh with a single in-flight
        request, and keep their tokens on network errors and 5xx.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200': { $ref: '#/components/responses/LoginOK' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: REFRESH_INVALID (unknown or expired) or REFRESH_REUSED (replay; family revoked). Log the user out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/AccountDisabled' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke a refresh token family
      description: >
        Idempotent; unknown tokens also return 204. The access token stays valid until it expires
        (default 15 minutes).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Logged out }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/me:
    get:
      operationId: getMe
      tags: [me]
      summary: Current user
      description: Use `onboarded` to decide whether to show the onboarding flow.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The caller's profile
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountDisabled' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/me/onboarding:
    post:
      operationId: completeOnboarding
      tags: [me]
      summary: Complete onboarding
      description: >
        In one transaction: saves the profile, binds the pet for the MBTI type, creates the caller's own
        room (seat 1) and issues one signup invite code. Idempotent: if the caller is already onboarded
        the existing result is returned and the request body is ignored.
        Invalid fields return 400 VALIDATION_FAILED with error.details.fields listing field names.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingRequest' }
      responses:
        '200':
          description: Onboarding result (also returned on repeat calls)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/OnboardingResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountDisabled' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/rooms/join:
    post:
      operationId: joinRoom
      tags: [rooms]
      summary: Join a room with an invite code
      description: >
        The code is normalised (whitespace and '-' removed, upper-cased), so "abcd-2345" works.
        A missing, null or non-string `code` is 400 VALIDATION_FAILED and does not count as a failure;
        any string that is not a usable code (malformed, unknown, expired, used, own room, banned) is
        404 CODE_INVALID and counts towards the cooldown: 5 within 10 minutes start a 30-minute
        CODE_COOLDOWN. A successful join resets the count. A repeat of an already-successful join by a
        user who is still seated in that room returns 200 with the current room, members and seat and
        the original reward codes (no second reward, no second seat); it neither counts as a failure
        nor resets the count. A used code that has since expired, or a user who is no longer seated,
        gets CODE_INVALID.
        Each client IP may make 30 attempts per hour (429 RATE_LIMITED with Retry-After).
        ROOM_FULL, ALREADY_MEMBER, ROOM_LIMIT and AGE_RESTRICTED do not consume the code.
        On success the caller may receive reward codes for their own room; `rewards` is [] when none.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinRequest' }
      responses:
        '200':
          description: Joined (also returned when repeating a successful join)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/JoinResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CodeInvalid' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/rooms/mine:
    get:
      operationId: listMyRooms
      tags: [rooms]
      summary: Rooms I am in
      description: >
        Every room the caller is an active member of, own room first. Members who left are not listed.
        The own room carries regen_remaining_today. [] before onboarding.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: My rooms
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RoomDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountDisabled' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/rooms/{id}/members/{user_id}:
    delete:
      operationId: removeMember
      tags: [rooms]
      summary: Owner removes a member
      description: >
        Owner only. The removed member is banned from the room: any later code for it is CODE_INVALID.
        A full room reopens; codes voided when it filled stay void. Removing someone who was seated
        but no longer is (left or dissolved out, including a leave that landed just before) succeeds,
        changes no seat and sends no event, but still bans them. Removing someone who never sat in the
        room, or a `user_id` that is not a user id, succeeds with no change at all. Ids are compared
        case-insensitively. Removing the owner
        is 400 VALIDATION_FAILED. A caller who is seated but not the owner gets 403 NOT_ROOM_OWNER;
        anyone else, or an unknown room, gets 404 ROOM_NOT_FOUND.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: user_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The room after the removal
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RoomResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotRoomOwner' }
        '404': { $ref: '#/components/responses/RoomNotFound' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/rooms/{id}/dissolve:
    post:
      operationId: dissolveRoom
      tags: [rooms]
      summary: Owner dissolves the room
      description: >
        Owner only. Every other member is moved out (nobody is banned, so they may join again with a new
        code) and the room's unused codes are voided. The room is left open with only the owner.
        Repeating the call succeeds with no change.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The room after dissolving
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RoomResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotRoomOwner' }
        '404': { $ref: '#/components/responses/RoomNotFound' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/rooms/{id}/codes:
    post:
      operationId: regenCode
      tags: [rooms]
      summary: Owner issues one more invite code
      description: >
        Owner only. Refused with 409 CODE_ISSUE_LIMIT when the room is not open
        (`details.reason` room_full), the room already has as many valid unused codes as free seats
        (enough_unused), the owner already issued the daily limit of such codes today in their own
        time zone (daily_limit), or the owner reached the lifetime cap of codes (lifetime_limit).
        Checked in that order; the first that applies is reported.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '201':
          description: The new code
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CodeInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotRoomOwner' }
        '404': { $ref: '#/components/responses/RoomNotFound' }
        '409':
          description: CODE_ISSUE_LIMIT with `error.details.reason`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/rooms/{id}/leave:
    post:
      operationId: leaveRoom
      tags: [rooms]
      summary: Leave a room I joined
      description: >
        For rooms owned by someone else. The owner calling it gets 409 OWNER_CANNOT_LEAVE (dissolve
        instead). Anyone who was ever seated in the room and no longer is (left, removed or dissolved
        out) gets the same 204, so a removed member cannot tell removal from leaving; someone who never
        was seated there, or an unknown room, gets 404 ROOM_NOT_FOUND. Leaving is not a ban: a new code
        works, but the join reward is paid once per room.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Left (or already gone) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/RoomNotFound' }
        '409':
          description: OWNER_CANNOT_LEAVE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/rooms/{id}/messages:
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message to the room or to one member
      description: >
        The caller must be seated in the room (else 404 ROOM_NOT_FOUND). `text` is trimmed and must be
        1 to 500 characters; a phrase message sends `phrase_id` instead and is never sent to AI. A dm
        (`scope` dm) needs `to_user_id`, another seated member, and both must be adults (else 403
        AGE_RESTRICTED). Idempotent on `client_msg_id`: replaying one returns the stored message and
        sends no events. `polish` is accepted but has no effect until B5b (`polish_requested` stays
        false). Receivers get `message.new` at once and `message.translated` when their translation
        lands. Limited to 20 messages per minute and 1000 per day per user (429 RATE_LIMITED).
        Invalid fields are 400 VALIDATION_FAILED with `error.details.fields`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '202':
          description: The stored message as the sender sees it (delivery is null)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MessageView' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/RoomNotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
    get:
      operationId: listMessages
      tags: [messages]
      summary: Message history
      description: >
        Messages the caller sent or received in the room, oldest first by id. Without a cursor the
        newest page; `before` gives the page just before that message id, `after` the page just after
        it (use it to catch up after reconnecting); not both. `limit` defaults to 30, at most 100.
        Receivers are fixed when a message is sent, so later joiners do not see earlier messages.
        The caller must be seated (else 404 ROOM_NOT_FOUND). A bad cursor or limit is 400
        VALIDATION_FAILED with `error.details.fields`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: before, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: after, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200':
          description: One page of messages
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MessagePage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountDisabled' }
        '404': { $ref: '#/components/responses/RoomNotFound' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/codes:
    get:
      operationId: listCodes
      tags: [codes]
      summary: My invite codes
      description: >
        Every code issued to the caller, newest first, not paginated. `status` is the effective
        status: an unused code past expires_at is reported as expired. [] before onboarding.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: My codes
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CodeListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountDisabled' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/config/phrases:
    get:
      operationId: getPhrases
      tags: [config]
      summary: Fixed phrase book
      description: >
        The fixed quick-phrases with their text in every supported language. Clients cache the book
        and send its version in `v`; an unchanged version gets 304 with an empty body.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: v
          in: query
          required: false
          description: The version the client already holds.
          schema: { type: string }
      responses:
        '200':
          description: The phrase book
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PhraseBook' }
        '304': { description: The client's version is current; empty body }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountDisabled' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/ws:
    get:
      operationId: openWebSocket
      tags: [realtime]
      summary: Realtime WebSocket
      description: >
        Upgrades to a WebSocket carrying room events (member joins and leaves, presence, pet taps).
        Send the access token in the Authorization header, never in the URL. The connection is
        closed with code 4401 when that access token expires; refresh it and reconnect at once.
        Upgrades are limited per IP and per user (429). Frames are JSON
        `{t, id?, seq?, d}`; the frame types, which ones carry a room seq, the error frame and the
        close codes are specified in backend TRD chapter 9. Every room.sub answers with a full
        room.snapshot.
      security: [{ bearerAuth: [] }]
      responses:
        '101':
          description: Switching to the WebSocket protocol; the first frame is hello.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503':
          description: NOT_READY, the server is restarting; reconnect after a random 1-10 s wait.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    LoginOK:
      description: Tokens and the signed-in user
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/LoginData' }
    ValidationFailed:
      description: VALIDATION_FAILED. Malformed, oversized (over 64 KB) or invalid body.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: UNAUTHORIZED. Missing, malformed, expired or invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AccountDisabled:
      description: ACCOUNT_DISABLED. The account is banned or deleted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ProviderNotConfigured:
      description: PROVIDER_NOT_CONFIGURED. This login provider is not available yet.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ProviderUnavailable:
      description: NOT_READY. The login provider's signing keys could not be fetched; retry later.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Internal:
      description: INTERNAL.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: >
        ACCOUNT_DISABLED (banned or deleted), ONBOARDING_REQUIRED (finish onboarding first) or
        AGE_RESTRICTED (adults and minors never share a room).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    CodeInvalid:
      description: >
        CODE_INVALID. The code cannot be used; the reason is deliberately not given.
        Counts towards the cooldown.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: >
        ROOM_FULL, ROOM_LIMIT (already in 2 rooms, own room included) or ALREADY_MEMBER
        (error.details.room_id names the room). The code is not consumed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotRoomOwner:
      description: NOT_ROOM_OWNER. The caller is seated in the room but does not own it.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RoomNotFound:
      description: >
        ROOM_NOT_FOUND. The room does not exist or the caller has no seat in it; the two are
        deliberately not told apart.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: >
        RATE_LIMITED (too many requests from this IP or user; wait for the Retry-After header) or
        CODE_COOLDOWN (too many wrong codes; wait error.details.retry_after_seconds, no header).
      headers:
        Retry-After:
          description: Seconds until the limit lifts (RATE_LIMITED only).
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    PhraseBook:
      type: object
      required: [version, phrases]
      properties:
        version: { type: string, example: '1' }
        phrases:
          type: array
          items:
            type: object
            required: [id, texts]
            properties:
              id: { type: string, example: good_morning }
              texts:
                type: object
                required: [ja, ko, zh-Hant, zh-Hans, en]
                properties:
                  ja: { type: string }
                  ko: { type: string }
                  zh-Hant: { type: string }
                  zh-Hans: { type: string }
                  en: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              example: NOT_READY
              description: >
                One of NOT_READY, INTERNAL, UNAUTHORIZED, VALIDATION_FAILED, ACCOUNT_DISABLED,
                REFRESH_INVALID, REFRESH_REUSED, PROVIDER_NOT_CONFIGURED, ONBOARDING_REQUIRED,
                CODE_INVALID, ROOM_FULL, ALREADY_MEMBER, ROOM_LIMIT, AGE_RESTRICTED, CODE_COOLDOWN,
                RATE_LIMITED.
            message: { type: string, description: 'For debugging only; localise by code.' }
            request_id: { type: string }
            details:
              type: object
              description: >
                fields on VALIDATION_FAILED from onboarding and messages; room_id on ALREADY_MEMBER;
                retry_after_seconds on CODE_COOLDOWN.
              properties:
                fields:
                  type: array
                  items: { type: string }
                room_id: { type: string, format: uuid }
                retry_after_seconds: { type: integer, minimum: 1 }
    IDTokenRequest:
      type: object
      required: [id_token]
      properties:
        id_token: { type: string, maxLength: 8192 }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    LoginData:
      type: object
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token: { type: string, description: 'JWT; send as "Authorization: Bearer ..."' }
        refresh_token: { type: string }
        expires_in: { type: integer, description: 'Access token lifetime in seconds.' }
        user:
          type: object
          required: [id, onboarded]
          properties:
            id: { type: string, format: uuid }
            onboarded: { type: boolean }
    Profile:
      type: object
      required: [id, onboarded]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string, nullable: true }
        native_lang: { type: string, nullable: true, enum: [ja, ko, zh-Hant, zh-Hans, en, null] }
        mbti: { type: string, nullable: true, example: ENFP }
        pet_type: { type: string, nullable: true, example: happy_shiba }
        age_band: { type: string, nullable: true, enum: [13_17, 18_plus, null] }
        tz: { type: string, nullable: true, example: Asia/Tokyo }
        onboarded: { type: boolean }
    OnboardingRequest:
      type: object
      required: [native_lang, mbti, nickname, age_band, tz]
      properties:
        native_lang: { type: string, enum: [ja, ko, zh-Hant, zh-Hans, en] }
        mbti: { type: string, pattern: '^[EI][NS][TF][JP]$', description: 'Upper case, e.g. ENFP.' }
        nickname: { type: string, description: 'Trimmed; 1 to 20 characters; no control characters.' }
        age_band: { type: string, enum: [13_17, 18_plus], description: 'Under-13 users must be stopped by the client.' }
        tz: { type: string, description: 'IANA time zone name, e.g. Asia/Tokyo.', example: Asia/Tokyo }
    OnboardingResult:
      type: object
      required: [user, pet, room, invite_code]
      properties:
        user: { $ref: '#/components/schemas/Profile' }
        pet:
          type: object
          required: [type, mbti]
          properties:
            type:
              type: string
              description: Stable pet slug; display names live in the client's i18n.
              enum:
                - lone_leopard
                - leader_lion
                - thinker_owl
                - clever_fox
                - guardian_deer
                - guide_dolphin
                - healing_rabbit
                - happy_shiba
                - steady_beaver
                - order_sheepdog
                - guardian_penguin
                - warm_otter
                - calm_blackcat
                - daring_falcon
                - easygoing_alpaca
                - party_parrot
            mbti: { type: string }
        room:
          type: object
          required: [id, member_count, capacity]
          properties:
            id: { type: string, format: uuid }
            member_count: { type: integer }
            capacity: { type: integer }
        invite_code:
          type: object
          required: [code, expires_at]
          properties:
            code: { type: string, description: '8 characters, no hyphen; format as XXXX-XXXX for display.', example: 98NX5RW3 }
            expires_at: { type: string, format: date-time }
    JoinRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, description: 'As typed; case, spaces and hyphens are ignored.', example: DEVA-2345 }
    RoomSummary:
      type: object
      required: [id, status, member_count, capacity]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [open, full, closed] }
        member_count: { type: integer }
        capacity: { type: integer }
    MemberInfo:
      type: object
      required: [user_id, nickname, pet_type, seat_no, role]
      properties:
        user_id: { type: string, format: uuid }
        nickname: { type: string, nullable: true }
        pet_type: { type: string, nullable: true, example: happy_shiba }
        seat_no: { type: integer, minimum: 1 }
        role: { type: string, enum: [owner, member] }
    CodeInfo:
      type: object
      required: [code, expires_at]
      properties:
        code: { type: string, description: '8 characters, no hyphen.', example: 98NX5RW3 }
        expires_at: { type: string, format: date-time }
    JoinResult:
      type: object
      required: [room, seat_no, members, rewards]
      properties:
        room: { $ref: '#/components/schemas/RoomSummary' }
        seat_no: { type: integer, minimum: 1, description: "The caller's seat." }
        members:
          type: array
          items: { $ref: '#/components/schemas/MemberInfo' }
        rewards:
          type: array
          description: Reward codes for the caller's own room; [] when none (never null).
          items: { $ref: '#/components/schemas/CodeInfo' }
    RoomResult:
      type: object
      required: [room]
      properties:
        room: { $ref: '#/components/schemas/RoomSummary' }
    RoomDetail:
      type: object
      required: [id, is_owner, status, member_count, capacity, members, regen_remaining_today]
      properties:
        id: { type: string, format: uuid }
        is_owner: { type: boolean }
        status: { type: string, enum: [open, full, closed] }
        member_count: { type: integer }
        capacity: { type: integer }
        members:
          type: array
          items: { $ref: '#/components/schemas/MemberInfo' }
        regen_remaining_today:
          type: integer
          nullable: true
          minimum: 0
          description: >
            Own room only (is_owner true): OWNER_REGEN_DAILY_LIMIT minus the owner_regen codes issued today
            in the owner's time zone, never below 0; null for rooms joined from others. Covers the daily limit
            only: room_full, enough_unused and lifetime_limit still come from POST /rooms/{id}/codes, which
            stays authoritative. Not part of room.snapshot.
    CodeListItem:
      type: object
      required: [code, source, status, expires_at, room]
      properties:
        code: { type: string, example: 98NX5RW3 }
        source: { type: string, enum: [signup, join_reward, owner_regen] }
        status:
          type: string
          enum: [unused, used, expired, void]
          description: Effective status; an unused code past expires_at is expired.
        expires_at: { type: string, format: date-time }
        room:
          type: object
          required: [id, member_count, capacity]
          properties:
            id: { type: string, format: uuid }
            member_count: { type: integer }
            capacity: { type: integer }
    SendMessageRequest:
      type: object
      required: [client_msg_id, kind]
      properties:
        client_msg_id: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$', description: 'Client-generated; the idempotency key.' }
        kind: { type: string, enum: [text, phrase] }
        text: { type: string, description: 'Required for kind text; trimmed, 1 to 500 characters.' }
        phrase_id: { type: string, description: 'Required for kind phrase; an id from GET /config/phrases.', example: good_morning }
        scope: { type: string, enum: [room, dm], default: room }
        to_user_id: { type: string, format: uuid, description: 'Required for scope dm.' }
        polish: { type: boolean, default: false, description: 'Text only; no effect until B5b.' }
    SenderInfo:
      type: object
      required: [user_id, nickname, pet_type]
      properties:
        user_id: { type: string, format: uuid }
        nickname: { type: string, nullable: true }
        pet_type: { type: string, nullable: true, example: happy_shiba }
    DeliveryView:
      type: object
      description: The receiver's own copy of the message.
      required: [id, target_lang, base_text, translation_status, polished_text, polish_status]
      properties:
        id: { type: string, format: uuid }
        target_lang: { type: string, enum: [ja, ko, zh-Hant, zh-Hans, en] }
        base_text: { type: string, nullable: true, description: 'The translation; null until translation_status is done.' }
        translation_status: { type: string, enum: [pending, done, failed] }
        polished_text: { type: string, nullable: true }
        polish_status: { type: string, enum: [none, pending, done, fallback] }
    MessageView:
      type: object
      description: Shared by REST responses and the message events (backend TRD 7.4).
      required: [id, room_id, sender, scope, to_user_id, kind, phrase_id, src_lang, text, client_msg_id,
        polish_requested, created_at, delivery]
      properties:
        id: { type: string, format: uuid }
        room_id: { type: string, format: uuid }
        sender: { $ref: '#/components/schemas/SenderInfo' }
        scope: { type: string, enum: [room, dm] }
        to_user_id: { type: string, format: uuid, nullable: true }
        kind: { type: string, enum: [text, phrase] }
        phrase_id: { type: string, nullable: true }
        src_lang: { type: string, enum: [ja, ko, zh-Hant, zh-Hans, en], description: "The sender's native_lang." }
        text: { type: string, description: "The original text (a phrase in the sender's language)." }
        client_msg_id: { type: string, nullable: true, description: "Only in the sender's own view." }
        polish_requested: { type: boolean }
        created_at: { type: string, format: date-time }
        delivery:
          allOf: [{ $ref: '#/components/schemas/DeliveryView' }]
          nullable: true
          description: "Null in the sender's view; the receiver's own delivery otherwise."
    MessagePage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          description: Oldest first by id; [] when none (never null).
          items: { $ref: '#/components/schemas/MessageView' }
        has_more: { type: boolean }
